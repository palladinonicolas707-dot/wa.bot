name: Compila APK Android

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Imposta Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Installa dipendenze di sistema Android
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          git wget curl unzip libltdl7 \
          openjdk-17-jdk \
          autoconf libtool pkg-config \
          zlib1g-dev libncurses5-dev libncursesw5-dev \
          cmake libffi-dev libssl-dev lld

    - name: Installa Buildozer, Cython e strumenti
      run: |
        python -m pip install --upgrade pip
        pip install --upgrade cython==0.29.36 buildozer

    - name: Accetta le licenze Android SDK
      run: |
        mkdir -p /home/runner/.buildozer/android/platform/android-sdk/licenses
        echo -e "\n8933bac163af427b230f127bc304382873f002f5" > /home/runner/.buildozer/android/platform/android-sdk/licenses/android-sdk-license
        echo -e "\n84831b9409646a918e30573bab4c9c91346d8abd" > /home/runner/.buildozer/android/platform/android-sdk/licenses/android-sdk-preview-license

    - name: Compila APK con Buildozer (Nativo)
      run: |
        buildozer -v android debug

    - name: Salva l'APK compilato
      uses: actions/upload-artifact@v4
      with:
        name: pacchetto-apk
        path: bin/*.apk
