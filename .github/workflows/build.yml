name: Compila APK Android

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - uses: actions/checkout@v4

    - name: Imposta Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Imposta Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Installa dipendenze di sistema e Android SDK Command-line tools
      uses: android-actions/setup-android@v3

    - name: Installa Buildozer e Cython
      run: |
        python -m pip install --upgrade pip
        pip install --upgrade cython==0.29.36 buildozer

    - name: Compila APK con Buildozer
      run: |
        buildozer -v android debug

    - name: Salva l'APK compilato
      uses: actions/upload-artifact@v4
      with:
        name: pacchetto-apk
        path: bin/*.apk
